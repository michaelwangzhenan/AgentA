name: AgentA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  UT:
    name: Fast UT
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MOONSHOT_API_KEY: ci-dummy
      QWEN_API_KEY: ci-dummy
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast UT
        run: pytest -q

  PERF:
    name: Performance Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MOONSHOT_API_KEY: ci-dummy
      QWEN_API_KEY: ci-dummy
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run perf_eval + grep gate
        run: |
          python -m tools.agent_eval.perf.eval_perf --target all --sizes 100,1000
          if grep -l 'FAIL' tools/reports/perf/perf-*.md; then
            echo "::error::Perf judge failed; download 'perf-reports' artifact for details"
            exit 1
          fi

      - name: Upload perf reports
        if: always()  # gate fail 时最需要报告
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports
          path: tools/reports/perf/perf-*.md
          if-no-files-found: warn
          retention-days: 30

  EVAL:
    name: Evaluation Gate (non-LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MOONSHOT_API_KEY: ci-dummy
      QWEN_API_KEY: ci-dummy
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 只跑不耗 token 的确定性评估子集（安全拦截等）；run_all --ci 有任一 FAIL 即非零退出
      - name: Run eval gate
        run: python -m tools.agent_eval.run_all --ci

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: tools/reports/run_all/run-all-*.md
          if-no-files-found: warn
          retention-days: 30
