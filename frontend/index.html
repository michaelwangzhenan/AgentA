<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentA - 个人 AI 学习助手</title>
    <script>
      // 提前 apply dark class，避免 React 渲染后才切换造成的"白屏闪一下"
      // 皮肤（非 light/dark/system）用 data-theme 标记；深色基底（*-dark）额外挂 .dark
      (function () {
        try {
          var t = localStorage.getItem('agenta-theme') || 'system';
          var dark = t === 'dark' || t.indexOf('-dark') !== -1 || (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (t !== 'light' && t !== 'dark' && t !== 'system')
            document.documentElement.dataset.theme = t;
        } catch (e) { /* localStorage 不可用：默认浅色 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
