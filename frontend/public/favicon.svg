<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
<title>AgentA</title>
<!-- 深色底圆：在浏览器标签栏上提高对比度 -->
<circle cx="32" cy="32" r="30" fill="#0c1929"/>
<!-- 轨道环：只保留一条实线，加粗 -->
<circle cx="32" cy="32" r="23" fill="none" stroke="#00c8ff" stroke-width="2.5"/>
<ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#0099dd" stroke-width="1.8" opacity="0.85"/>
<!-- 字母 A：白色主体 + 青色横杠，小尺寸下更清晰 -->
<path d="M20 46 L32 16 L44 46" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="24.5" y1="35" x2="39.5" y2="35" stroke="#00e8ff" stroke-width="5" stroke-linecap="round"/>
<!-- 节点：只保留四个顶点，加大 -->
<circle cx="32" cy="16" r="3.5" fill="#00e8ff"/>
<circle cx="20" cy="46" r="3" fill="#00c8ff"/>
<circle cx="44" cy="46" r="3" fill="#00c8ff"/>
<circle cx="32" cy="8" r="2.5" fill="#00c8ff"/>
</svg>
