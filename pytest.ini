[pytest]
testpaths = tests
pythonpath = .

# tests/optional/ 放备用测试，默认 --ignore 不收集
# 需要时单独跑：pytest tests/optional -m langchain / autogpt
addopts = -v --tb=short --ignore=tests/optional -m "not integration and not langchain and not autogpt and not slow"

markers =
    integration: 真实 API / 网络 / ChromaDB 调用
    slow: 慢用例（真实文件入库 / Office 解析 / 超时等待等）
    langchain: LangChain 实现相关（在 tests/optional，import langchain 较慢）
    autogpt: AutoGPT 实现相关（在 tests/optional，默认不收集）