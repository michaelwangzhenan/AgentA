[pytest]
testpaths = tests
pythonpath = .
# 默认排除：integration（真实 API/网络）、langchain & autogpt 两套备用 impl、extended_providers（kimi/qwen 以外的 7 个 provider）
# 想跑全量：pytest -m ""；只跑某档：pytest -m "langchain" / -m "autogpt" / -m "extended_providers" / -m "integration"
addopts = -v --tb=short -m "not integration and not langchain and not autogpt and not extended_providers"
markers =
    integration: 真实 API / 网络 / ChromaDB 调用
    langchain: LangChain Agent 实现相关（默认 deselect；import langchain 较慢）
    autogpt: AutoGPT Agent 实现相关（默认 deselect）
    extended_providers: kimi / qwen 以外的 7 个 LLM provider（按需开启）
