    <h1>向量数据库介绍</h1>
    <p>向量数据库是专门用于存储和检索高维向量数据的数据库系统。</p>
    <h2>主要特点</h2>
    <ul>
        <li>支持高效的相似度搜索（ANN 算法）</li>
        <li>适合存储文本、图像、音频的嵌入向量</li>
        <li>常见产品：ChromaDB、Pinecone、Weaviate、Milvus</li>
    </ul>
    <h2>ChromaDB</h2>
    <p>ChromaDB 是一款开源的本地向量数据库，零配置，Python 原生支持，适合个人和小团队使用。</p>
